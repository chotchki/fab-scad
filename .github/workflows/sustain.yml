# Sustainment nightly (Phase SU): we hand-recreated OpenSCAD + BOSL2, so parity is a MOVING target —
# this watches both upstreams and re-proves parity against what changed. REPORT-ONLY by design
# (chotchki 2026-07-22): no auto-PR, no auto-merge — the run maintains ONE rolling issue whose body
# carries a machine-readable watermark (`<!-- sustain-state {...} -->`), so the nightly never commits
# to the repo. A human bumps pins with the report in hand. Full design: docs/sustainment.md.
#
# Probes (cheap, short-circuit when nothing moved):
#   BOSL2   — newest upstream tag vs the state's `bosl2_tag` (BOSL2 tags every revision).
#   openscad — the `tests/data/scad/` + `examples/` TREE SHAs on master vs the state's `openscad_corpus`
#              ("most of the change we don't care about" — only corpus paths matter to us).
#   builtins — the blob SHAs of upstream's builtin-REGISTRATION files vs `openscad_builtins` (AS.7):
#              a change there is upstream adding/renaming/re-typing a builtin, the one layer beneath
#              every differential. Tripwire-only (no C++ parsing) — the report pairs the moved file
#              with OUR declared surface (`fab builtins --md`) so a human diffs a list, not a repo.
# Evaluation (only for what moved): the SU.2 intrinsic matrix + the SU.3 corpus differential against
# a candidate BOSL2 checkout; the SU.4 files-lane sweep over new/changed openscad corpus files.
name: sustain

on:
  schedule:
    - cron: "30 6 * * *" # nightly 06:30 UTC (fuzz owns 06:00)
  workflow_dispatch:
    inputs:
      rewind:
        description: "Ignore the stored watermark and evaluate everything (the SU.6 e2e lever)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "Sustainment watch: upstream OpenSCAD + BOSL2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The rolling issue IS the database: find it (or create it empty) and pull the state block.
      - name: Load watermark from the rolling issue
        id: state
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
                --jq "first(.[] | select(.title == \"$ISSUE_TITLE\")) | .number // empty")
          if [ -z "$num" ]; then
            num=$(gh issue create --title "$ISSUE_TITLE" \
              --body "Bootstrapping — the first sustain run fills this in." \
              | grep -oE '[0-9]+$')
          fi
          echo "issue=$num" >> "$GITHUB_OUTPUT"
          body=$(gh issue view "$num" --json body --jq .body)
          printf '%s' "$body" > /tmp/prev-body.md
          state=$(printf '%s' "$body" | sed -n 's/.*<!-- sustain-state \(.*\) -->.*/\1/p' | head -1)
          if [ "${{ inputs.rewind }}" = "true" ] || [ -z "$state" ]; then
            state='{}'
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "watermark: $state (issue #$num)"

      - name: Probe upstreams
        id: probe
        run: |
          set -euo pipefail
          # BOSL2: newest tag by version sort (they tag every revision).
          bosl2_latest=$(git ls-remote --tags https://github.com/BelfrySCAD/BOSL2.git \
            | awk -F/ '{print $NF}' | grep -E '^v[0-9]' | grep -v '\^{}' | sort -V | tail -1)
          # The pinned version comes from BOSL2's own version.scad — the runner's submodule checkout
          # has no tag refs (actions/checkout fetches submodules tagless), so git-describe can't.
          bosl2_pinned="v$(sed -n 's/^BOSL_VERSION = \[\(.*\)\];/\1/p' libs/BOSL2/version.scad | tr -d ' ' | tr ',' '.')"
          # openscad: the corpus-path tree SHAs on master (change iff contents change) + HEAD for diffing.
          # One recursive tree fetch feeds BOTH the corpus probe and the builtin-file probe.
          os_head=$(gh api repos/openscad/openscad/branches/master --jq .commit.sha)
          gh api "repos/openscad/openscad/git/trees/$os_head?recursive=1" > /tmp/os-tree.json
          os_corpus=$(jq -r '[.tree[] | select(.path=="examples" or .path=="tests/data/scad") | "\(.path)=\(.sha)"] | sort | join(",")' /tmp/os-tree.json)
          # AS.7: the files where upstream REGISTERS builtin functions — builtin_functions.cc (the
          # function table; the #5017 crash citation names it) and control.cc (parent_module + the
          # control builtins). Blob SHAs, so this moves iff the file contents move.
          os_builtins=$(jq -r '[.tree[] | select(.path=="src/core/builtin_functions.cc" or .path=="src/core/control.cc") | "\(.path)=\(.sha)"] | sort | join(",")' /tmp/os-tree.json)
          {
            echo "bosl2_latest=$bosl2_latest"
            echo "bosl2_pinned=$bosl2_pinned"
            echo "os_head=$os_head"
            echo "os_corpus=$os_corpus"
            echo "os_builtins=$os_builtins"
          } >> "$GITHUB_OUTPUT"
          state='${{ steps.state.outputs.state }}'
          seen_tag=$(printf '%s' "$state" | jq -r '.bosl2_tag // empty')
          seen_corpus=$(printf '%s' "$state" | jq -r '.openscad_corpus // empty')
          seen_builtins=$(printf '%s' "$state" | jq -r '.openscad_builtins // empty')
          bosl2_moved=false; os_moved=false; builtins_moved=false
          [ "$bosl2_latest" != "$seen_tag" ] && bosl2_moved=true
          [ "$os_corpus" != "$seen_corpus" ] && os_moved=true
          [ "$os_builtins" != "$seen_builtins" ] && builtins_moved=true
          echo "bosl2_moved=$bosl2_moved" >> "$GITHUB_OUTPUT"
          echo "os_moved=$os_moved" >> "$GITHUB_OUTPUT"
          echo "builtins_moved=$builtins_moved" >> "$GITHUB_OUTPUT"
          # AO.8: the heavy perf lane is WEEKLY, not nightly — ~10 min of oracle forks for a
          # different question than gen-diff asks. Sunday, or any manual dispatch.
          weekly=false; [ "$(date -u +%u)" = "7" ] && weekly=true
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"
          echo "BOSL2 $bosl2_pinned pinned, $bosl2_latest upstream (seen: ${seen_tag:-never}) → moved=$bosl2_moved"
          echo "openscad corpus $os_corpus (seen: ${seen_corpus:-never}) → moved=$os_moved"
          echo "openscad builtin files $os_builtins (seen: ${seen_builtins:-never}) → moved=$builtins_moved"

      # The corpus lanes below stay movement-gated; the BUILD is unconditional since AL — the
      # gen-diff lane runs EVERY night (its oracle is the newest upstream nightly, so each run is
      # a fresh differential regardless of corpus movement).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the sustainment tools
        run: cargo build --release --bin fab --bin corpus_worker

      # AL — the generated-program differential (chotchki 2026-07-22: "an idea if we have a hole
      # that's non-obvious from their examples"): fab-gen programs through OUR engine AND the
      # NEWEST upstream Linux nightly AppImage, echo-diffed + timed. Report-only, like everything
      # here. Linux nightlies are FRESHER than any macOS install (their mac pipeline is the broken
      # one) — this lane diffs against a newer oracle than local dev ever sees, and the report's
      # version line says who judged. The name regex spans BOTH snapshot naming schemes (the
      # `.aiNNNNN` build segment was dropped in early 2026); sort key = the date field.
      # NO display needed: -o exports render fine headless once the host GL libs exist (probed) —
      # libegl1/libopengl0 are the AppImage's ONLY unbundled deps (GL is host-owned by convention).
      - name: Generated-program differential vs the upstream nightly
        run: |
          set -euo pipefail
          # fonts-liberation: our engine BUNDLES Liberation Sans (determinism doctrine #36); the
          # AppImage resolves its default font via fontconfig — same face on both sides or the
          # metrics arms diverge for boring reasons.
          sudo apt-get update -q && sudo apt-get install -y -q libegl1 libopengl0 fonts-liberation > /dev/null
          img=$(curl -s https://files.openscad.org/snapshots/ \
            | grep -oE 'OpenSCAD-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.ai[0-9]+)?-x86_64\.AppImage' \
            | sort -u -t- -k2,2 | tail -1)
          echo "oracle nightly: $img"
          curl -sL "https://files.openscad.org/snapshots/$img" -o /tmp/openscad.AppImage
          chmod +x /tmp/openscad.AppImage
          (cd /tmp && ./openscad.AppImage --appimage-extract > /dev/null)
          export OPENSCAD=/tmp/squashfs-root/AppRun
          {
            echo "## gen-diff — generated programs vs $img"
            echo
            ./target/release/fab gen-diff --seeds 1000 --md || echo "gen-diff harness failed (see run log)"
          } > /tmp/report-gendiff.md

      # AO.8 — the HEAVY generated lane, weekly rather than nightly: it costs ~10 min of oracle
      # forks and its value is not the same as gen-diff's. gen-diff runs a thousand CHEAP programs
      # for broad echo coverage; this runs FEW BIG ones and reports what a real render costs on
      # each side, plus a scaling curve across the complexity dial.
      #
      # HONEST CAVEAT, and the reason nobody should quote the ratio yet (AO.12): today's dial grows
      # program TEXT, not geometry, so the oracle never gets far enough from its own process fork
      # for the adjusted number to mean much — the `fork %` column says exactly how much of its
      # time was startup, and it is still tens of percent. The lane earns its slot RIGHT NOW on the
      # divergence channel, which found a real swizzle bug in fab and an upstream abort
      # (docs/openscad-search-crash.md) in one 12-minute run. Timing goes honest after AO.2.
      #
      # Reuses the AppImage the gen-diff step extracted — same oracle, one download.
      - name: Heavy generated perf lane vs the upstream nightly
        if: github.event_name == 'workflow_dispatch' || fromJSON(steps.probe.outputs.weekly)
        run: |
          set -euo pipefail
          export OPENSCAD=/tmp/squashfs-root/AppRun
          {
            echo "## gen-perf — heavy generated programs, fab vs the upstream nightly"
            echo
            echo "_Weekly. Read \`fork %\` before the ratio: a row whose oracle time is mostly"
            echo "process startup is not measuring rendering (AO.4/AO.12)._"
            echo
            ./target/release/fab gen-perf --dials 2,4,8,16 --budget 600 --timeout 60 --md \
              || echo "gen-perf harness failed (see run log)"
          } > /tmp/report-genperf.md

      - name: Evaluate BOSL2 candidate
        if: steps.probe.outputs.bosl2_moved == 'true'
        run: |
          set -euo pipefail
          tag='${{ steps.probe.outputs.bosl2_latest }}'
          git clone --depth 1 --branch "$tag" https://github.com/BelfrySCAD/BOSL2.git /tmp/bosl2-candidate
          {
            echo "## BOSL2 ${{ steps.probe.outputs.bosl2_pinned }} (pinned) → $tag (upstream)"
            echo
            ./target/release/fab intrinsics --bosl2 /tmp/bosl2-candidate --md || true
            echo
            ./target/release/fab corpus-diff --candidate /tmp/bosl2-candidate --md || true
          } > /tmp/report-bosl2.md

      - name: Evaluate openscad corpus delta
        if: steps.probe.outputs.os_moved == 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openscad/openscad.git /tmp/openscad
          # regression/echo = upstream's golden console outputs, the sweep's expected-failure source
          # (cone mode also brings tests/CMakeLists.txt, whose FAILING_FILES is the other source).
          # tests/data/json holds the json-import corpus DATA (outside tests/data/scad — the MCAD
          # lesson, file flavor); the .scad tests import from it.
          git -C /tmp/openscad sparse-checkout set tests/data/scad tests/data/ttf tests/data/json tests/regression/echo examples
          # MCAD is an openscad SUBMODULE (libraries/MCAD) the sparse clone never materializes — the
          # corpus includes it (`include <MCAD/fonts.scad>`), so wire it like upstream's harness does.
          git clone --depth 1 https://github.com/openscad/MCAD.git /tmp/openscad/libraries/MCAD
          state='${{ steps.state.outputs.state }}'
          seen_head=$(printf '%s' "$state" | jq -r '.openscad_head // empty')
          if [ -n "$seen_head" ]; then
            # Changed corpus .scad files since the watermark commit (compare API; 300-file cap is fine
            # for corpus-path churn — a bigger delta than that deserves the full-sweep fallback anyway).
            gh api "repos/openscad/openscad/compare/$seen_head...${{ steps.probe.outputs.os_head }}" \
              --jq '.files[].filename' 2>/dev/null \
              | grep -E '^(tests/data/scad|examples)/.*\.scad$' \
              | sed 's|^|/tmp/openscad/|' > /tmp/manifest.txt || true
          else
            find /tmp/openscad/tests/data/scad /tmp/openscad/examples -name '*.scad' > /tmp/manifest.txt
          fi
          # Only files that still exist (a compare delta can name deletions).
          grep -vxF "" /tmp/manifest.txt | while read -r f; do [ -f "$f" ] && echo "$f"; done \
            > /tmp/manifest-live.txt || true
          {
            echo "## openscad corpus (master, ${{ steps.probe.outputs.os_head }})"
            echo
            if [ -s /tmp/manifest-live.txt ]; then
              OPENSCADPATH=/tmp/openscad/libraries \
                ./target/release/fab scad-sweep --manifest /tmp/manifest-live.txt --upstream /tmp/openscad --md
            else
              echo "Corpus paths changed, but no surviving \`.scad\` files to sweep."
            fi
          } > /tmp/report-openscad.md

      # AS.7 — the builtin-surface lane: upstream touched a registration file, so say WHICH, and
      # print OUR declared surface next to it. Tripwire + list, no C++ parsing — behavior drift is
      # gen-diff's job (every night, above); this is the lane that catches an ADDED builtin, which
      # behaves as a silent `undef` and so never diverges an echo of programs that don't call it.
      - name: Builtin surface watch
        if: steps.probe.outputs.builtins_moved == 'true'
        run: |
          set -euo pipefail
          state='${{ steps.state.outputs.state }}'
          seen=$(printf '%s' "$state" | jq -r '.openscad_builtins // "never seen"')
          {
            echo "## builtins — upstream registration files moved"
            echo
            echo '```'
            echo "now:  ${{ steps.probe.outputs.os_builtins }}"
            echo "seen: $seen"
            echo '```'
            echo
            echo "_A moved file means upstream added, renamed, or re-typed a builtin (or touched"
            echo "the file for unrelated reasons — the diff on those two paths says which). Ours:_"
            echo
            ./target/release/fab builtins --md || echo "fab builtins failed (see run log)"
          } > /tmp/report-builtins.md

      # The issue updates EVERY night now (gen-diff always produces a fresh section). Corpus
      # sections use tonight's report when a lane RAN, else carry over from the previous body —
      # the issue stays the complete database on quiet nights.
      - name: Update the rolling issue
        run: |
          set -euo pipefail
          state=$(jq -cn \
            --arg tag '${{ steps.probe.outputs.bosl2_latest }}' \
            --arg corpus '${{ steps.probe.outputs.os_corpus }}' \
            --arg head '${{ steps.probe.outputs.os_head }}' \
            --arg builtins '${{ steps.probe.outputs.os_builtins }}' \
            '{bosl2_tag: $tag, openscad_corpus: $corpus, openscad_head: $head, openscad_builtins: $builtins}')
          # Carry-over: a lane that DIDN'T run tonight keeps its section from the previous body
          # (order there: gen-diff, gen-perf, BOSL2, openscad, builtins). Every carve-out is the
          # awk shape — bounded on "the next ## heading, whatever it is" — because a sed range
          # whose closing pattern is absent runs to EOF and swallows every later section; the
          # `## builtins` section landing AFTER `## openscad` (AS.7) turned that old sed risk on
          # the openscad lane into a live bug, so the seds are gone.
          carve() { awk -v h="$1" '/^## /{f = (index($0, h) == 1)} f' /tmp/prev-body.md; }
          if [ ! -f /tmp/report-genperf.md ]; then
            carve "## gen-perf" > /tmp/report-genperf.md || true
          fi
          if [ ! -f /tmp/report-bosl2.md ]; then
            carve "## BOSL2" > /tmp/report-bosl2.md || true
          fi
          if [ ! -f /tmp/report-openscad.md ]; then
            carve "## openscad corpus" > /tmp/report-openscad.md || true
          fi
          if [ ! -f /tmp/report-builtins.md ]; then
            carve "## builtins" > /tmp/report-builtins.md || true
          fi
          {
            echo "<!-- sustain-state $state -->"
            echo
            echo "_Last evaluation: $(date -u +%Y-%m-%dT%H:%MZ) · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · report-only: pins bump by hand (docs/sustainment.md)_"
            echo
            cat /tmp/report-gendiff.md
            if [ -s /tmp/report-genperf.md ]; then echo; cat /tmp/report-genperf.md; fi
            if [ -s /tmp/report-bosl2.md ]; then echo; cat /tmp/report-bosl2.md; fi
            if [ -s /tmp/report-openscad.md ]; then echo; cat /tmp/report-openscad.md; fi
            if [ -s /tmp/report-builtins.md ]; then echo; cat /tmp/report-builtins.md; fi
          } > /tmp/issue-body.md
          gh issue edit '${{ steps.state.outputs.issue }}' --body-file /tmp/issue-body.md
          cat /tmp/issue-body.md >> "$GITHUB_STEP_SUMMARY"

      # The watcher must not fail SILENTLY — a broken probe is itself drift.
      - name: Surface a workflow failure on the issue
        if: failure() && steps.state.outputs.issue != ''
        run: |
          gh issue comment '${{ steps.state.outputs.issue }}' --body \
            "⚠️ sustain run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) FAILED — the watcher itself needs attention."
