# Native installers (mac .app+DMG, Windows NSIS) — UN-PARKED (W.2.2). A `v*` tag builds both
# and attaches them to the tag's GitHub Release; release-web fires on the same tag and adds the
# wasm bundle — ONE release, three artifacts. Manual dispatch → CI artifacts only, no release.
#
# macOS signing is SECRETS-GATED: all six secrets set → Developer-ID signed + notarized + stapled
# (app AND dmg); any missing → unsigned build, same artifacts, warnings only. The secret ceremony
# (Apple Developer enrollment, cert, API key) is documented in docs/packaging.md "signing".
name: release-native

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # AM.2 — defense-in-depth behind the tag ruleset ("release tags require green CI", repo ruleset
  # 19646314): a red tag can't even be PUSHED, so this gate normally sees green instantly. It exists
  # for the ruleset's failure modes (deleted/bypassed ruleset, API-created tags) — a release must
  # never package from a commit whose CI is red. Non-tag runs (manual dispatch = CI artifacts only,
  # no publish) pass through ungated.
  gate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require green CI on the tagged commit
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "not a tag — no publish happens, no gate needed"
            exit 0
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --paginate --jq '.check_runs[] | "\(.name)=\(.conclusion)"')
          fail=0
          # TA.3 added `windows`. Until this release, every name on this list was macOS or ubuntu,
          # so the gate asserted green CI on a commit no Windows machine had ever compiled — and
          # that is exactly how v1.3.0 and v1.3.1 shipped a Windows build that could not finish.
          for c in build windows kani miri asan boot-gate; do
            if ! grep -qx "$c=success" <<< "$runs"; then
              echo "::error::required CI check '$c' is not green on $GITHUB_SHA — release blocked"
              fail=1
            fi
          done
          exit "$fail"

  package:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            formats: app,dmg
          - os: windows-latest
            formats: nsis
    runs-on: ${{ matrix.os }}
    env:
      # cargo-packager reads APPLE_CERTIFICATE(+_PASSWORD) itself (temp-keychain import) and
      # notarytool reads APPLE_API_KEY/_ISSUER/_KEY_PATH — names are its API, don't rename.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # TB: presence FLAG only — the update-signing key itself is scoped to the one step that
      # writes it to a 0600 file ("Enable updater artifacts"), never the job-wide env.
      UPDATER_KEY_PRESENT: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY != '' }}
    steps:
      # SUBMODULES, and this is not boilerplate: without them `libs/BOSL2` is EMPTY, fab-bosl2's
      # build script takes its not-checked-out path, and the signed app ships a library crate that
      # declares NOTHING — every BOSL2 call in the released desktop build interprets. It does not
      # fail the build, by design ("a missing asset costs a PART, not an error"), so it shipped
      # silently. The `transpiled()` gate below is the part that stops it coming back.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # WINDOWS IS BROKEN HERE AND lld IS NOT THE FIX — do not re-try it without reading this.
      #
      # The Windows job has hit the 6-hour ceiling on every tag since the transpiled band became
      # real. It was tried with `rust-lld` (`-Clinker-flavor=lld-link`, the stable spelling —
      # `msvc-lld` is nightly-gated) and the stall was IDENTICAL, in the same place. The linker was
      # never the problem, so that step is gone rather than left in as an unproven change on the
      # release path.
      #
      # What the bounded probe (.github/workflows/win-probe.yml) actually established:
      #
      #   - `fab-bosl2` DOMINATES this build. macOS: 816.5s of a 918s step, ~89%. And it is built
      #     TWICE per release — once under fab's feature set, once under fab-gui's (719.5s).
      #   - Windows cannot finish in 45 min what macOS does in 15. Both probe steps expired, so no
      #     Windows timings report exists — cargo only writes one on completion.
      #   - At the kill, `fab_scad`'s rustc was in flight, started 40 min earlier (45.3s on macOS).
      #     `fab-bosl2` started 3 min before it and cargo never prints unit COMPLETIONS, so the two
      #     cannot be told apart from the log. Do not assume it is one of them.
      #
      # The anomaly to chase: windows-latest has 4 cores to macos-14's 3, so Windows should be
      # FASTER. A 70x+ gap on identical rustc/LLVM/flags is not a CPU story. Untested leads, in the
      # order worth trying — Windows Defender scanning every intermediate object rustc writes (a
      # target-dir + CARGO_HOME exclusion is a known 2-5x CI win, and the crate writing the most
      # files is exactly the one that dies), then memory pressure (16 GB, parallel LLVM on one huge
      # module — paging looks exactly like a hang). `opt-level`/`codegen-units` on fab-bosl2 would
      # trade away the transpiler's entire point, so they come last.
      # A `vX.Y.Z` tag must BE Packager.toml's version — a mismatched tag would publish artifacts
      # whose embedded version contradicts the release they hang off.
      - name: Tag matches Packager.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(sed -n 's/^version = "\(.*\)"/\1/p' Packager.toml)
          TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "tag/version drift: tag=v$TAG but Packager.toml=$PKG"; exit 1; }
          # TB: the self-updater compares env!(CARGO_PKG_VERSION) — gui/Cargo.toml's number, which
          # NOTHING coupled to the tag until an update that "kept being available" would have shipped.
          # head -1 pins the [package] version (dep tables carry version keys further down).
          for f in Cargo.toml gui/Cargo.toml; do
            V=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f" | head -1)
            [ "$V" = "$PKG" ] || { echo "version drift: $f=$V but Packager.toml=$PKG — bump the four pins together"; exit 1; }
          done
      # The CFBundleVersion pin (packaging/macos/Info.plist) exists for reproducible builds — a
      # stale pin ships the wrong build number, so drift fails the run before the long build.
      - name: CFBundleVersion pin matches Packager.toml
        if: runner.os == 'macOS'
        run: |
          PKG=$(sed -n 's/^version = "\(.*\)"/\1/p' Packager.toml)
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' packaging/macos/Info.plist)
          [ "$PKG" = "$PLIST" ] || { echo "version drift: Packager.toml=$PKG Info.plist=$PLIST — bump them together"; exit 1; }
      # Appending a bare key relies on [macos] being the LAST table in Packager.toml (a second
      # [macos] header would be a TOML parse error) — the file says so where it counts.
      # cargo-packager takes it from there: codesign (hardened runtime + timestamp) → notarytool
      # submit → staple, then signs the DMG it wraps the stapled .app into.
      - name: Enable signing (secrets present)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          printf '\nsigning-identity = "%s"\n' "$APPLE_SIGNING_IDENTITY" >> Packager.toml
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # cargo-packager does NOT build — binaries must exist first. Build EXACTLY the two it packages
      # (`Packager.toml` [[binaries]]: fab-gui, fab), not `--workspace --bins`.
      #
      # That used to say `--workspace --bins`, which builds NINE: the two shipped plus seven dev-only
      # tools (corpus_worker, corpus_repro, pack_libs, mesh_diff, models_worker, diff_repro,
      # echo_repro). Harmless while it lasted, because SZ.1 found this workflow had no `submodules:`
      # key at all — BOSL2 checked out EMPTY, the transpiled band declared nothing, and all nine
      # binaries were small. Fixing that made the band real, and nine large static links is a very
      # different job: macOS absorbed it (25 min) and Windows did not finish inside the 6-hour
      # ceiling, so v1.3.0 shipped without the .exe every release before it had.
      #
      # Seven of those links were for binaries nobody downloads. This builds the two that ship.
      # `--timings` because we have now spent seven CI-hours inferring this build's cost from
      # SILENCE. A cancelled job tells you when output stopped, not what it was doing; the report
      # gives a per-unit duration with codegen and link separated, so "is it link.exe or is it
      # LLVM" stops being a hypothesis. Cheap (an HTML file), and uploaded even on failure — the
      # run we most need it from is the one that dies.
      - run: cargo build --release -p fab-gui --bin fab-gui -p fab-scad --bin fab --timings
      - name: Build timings (which unit ate the wall clock)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ matrix.os }}
          path: target/cargo-timings/
          if-no-files-found: warn
      # Pinned since TB: the updater artifact's tar layout + signature format are now a shipped
      # contract with installed apps, so packager upgrades happen in the repo, not silently in CI.
      # (0.11.8 is also the version whose source the signing/notarize/staple ordering was verified
      # against — sign_outputs tars the .app AFTER package() staples it.)
      - run: cargo install cargo-packager --locked --version 0.11.8
      # TB self-update artifacts. With the key available, `cargo packager` tars the stapled .app
      # into fab-scad.app.tar.gz and minisign-signs it (that .sig goes INTO latest.json below) —
      # no key, no artifacts, same release as today. Deliberate hardening shape (review findings):
      #   - gated on APPLE signing too — an unsigned/un-notarized build must never enter the
      #     auto-update channel every installed app trusts;
      #   - the secret is scoped to THIS step's env and written to a 0600 file; what GITHUB_ENV
      #     carries forward is the PATH (cargo-packager accepts key-or-path), so the key material
      #     never sits in the job-wide env where every later third-party action could read it;
      #   - placed AFTER the build steps so the full dependency graph (build scripts, proc-macros)
      #     compiles without the secret in its environment;
      #   - the password var is genuinely empty but must be SET, or cargo-packager prompts
      #     interactively and hangs the job (the key was minted passwordless — it lives inside a
      #     secret store; a password stored beside it protects nothing).
      - name: Enable updater artifacts (secrets present)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != '' && env.UPDATER_KEY_PRESENT == 'true'
        env:
          UPDATER_SIGN_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/updater.key"
          printf '%s\n' "$UPDATER_SIGN_KEY" >> "$RUNNER_TEMP/updater.key"
          {
            echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY=$RUNNER_TEMP/updater.key"
            echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD="
          } >> "$GITHUB_ENV"
      - run: cargo packager --release --formats ${{ matrix.formats }}
      # cargo-packager staples the .app but only SIGNS the dmg — notarize+staple the dmg too, so
      # Gatekeeper clears it before the user ever reaches the .app inside.
      - name: Notarize + staple DMG
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          xcrun notarytool submit target/packager/*.dmg \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple target/packager/*.dmg
      # The point of the whole exercise: Gatekeeper must accept both artifacts, in CI, every run.
      - name: Gatekeeper assessment
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          spctl -a -t open --context context:primary-signature -vv target/packager/*.dmg
          spctl -a -t exec -vv target/packager/fab-scad.app
      # TB: the update manifest the in-app updater polls at releases/latest/download/latest.json.
      # cargo-packager does not write it (upstream #350); the shared script does — see its header
      # for the macos-aarch64-not-darwin landmine. Tags only (the url embeds the tag); a run without
      # the updater secret has no .sig and skips with a warning — that release just isn't
      # self-updatable, exactly like every release before TB. macOS job only: Windows has no
      # updater wired, and a second latest.json upload would clobber this one (softprops
      # overwrite is delete-then-reupload, not merge) — fan that in properly if Windows ever joins.
      - name: Update manifest (latest.json)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          SIG=target/packager/fab-scad.app.tar.gz.sig
          if [ ! -f "$SIG" ]; then
            echo "::warning::no updater artifact (CARGO_PACKAGER_SIGN_PRIVATE_KEY unset) — this release ships without self-update"
            exit 0
          fi
          # The one check that makes key rotation survivable: the artifact's signature must verify
          # against the pubkey BAKED INTO THIS BUILD (gui/src/update.rs::PUBKEY). A CI secret
          # swapped without re-baking the const would otherwise publish a manifest no installed
          # app can verify — silently, forever. Fail the release instead.
          brew install --quiet minisign
          sed -n 's/^const PUBKEY: &str = "\(.*\)";$/\1/p' gui/src/update.rs | base64 -d > "$RUNNER_TEMP/fab.pub"
          base64 -d "$SIG" > "$RUNNER_TEMP/fab.sig"
          minisign -Vm target/packager/fab-scad.app.tar.gz -x "$RUNNER_TEMP/fab.sig" -p "$RUNNER_TEMP/fab.pub" \
            || { echo "::error::updater artifact signed with a key that does NOT match gui/src/update.rs::PUBKEY — installed apps could never verify this update"; exit 1; }
          PKG=$(sed -n 's/^version = "\(.*\)"/\1/p' Packager.toml)
          bash packaging/macos/make-update-manifest.sh "$PKG" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${PKG}/fab-scad.app.tar.gz" \
            "$SIG" target/packager/latest.json
          cat target/packager/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: fab-scad-${{ matrix.os }}
          path: |
            target/packager/*.dmg
            target/packager/*.exe
            target/packager/*.app.tar.gz
            target/packager/latest.json
          if-no-files-found: error
      # Tags publish: each matrix job attaches its installer to the tag's release (created by
      # whichever job lands first; release-web adds the wasm bundle to the same one). The updater
      # pair (fab-scad.app.tar.gz + latest.json) rides the same upload; absent patterns are
      # skipped, so secretless releases still publish the installers.
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          # TB: published-tag assets are IMMUTABLE. A re-run must only backfill missing assets
          # (the Windows .exe that died), never replace live ones — softprops' overwrite is
          # delete-then-reupload, and a rebuilt tarball replacing the old one BEFORE latest.json
          # follows would leave the live manifest's signature pointing at bytes it never signed.
          # A genuinely bad artifact ships as a new patch tag, not a re-run.
          overwrite_files: false
          files: |
            target/packager/*.dmg
            target/packager/*.exe
            target/packager/*.app.tar.gz
            target/packager/latest.json
          body: |
            fab-scad native installers — macOS DMG (Developer-ID signed + notarized + stapled) and
            Windows NSIS (unsigned — winget pins SHA256, docs/packaging.md "signing bill").
            The matching wasm bundle (fab-gui-*.tar.gz) is attached by release-web.
            fab-scad.app.tar.gz + latest.json feed the macOS in-app self-update (docs/packaging.md
            "auto-update") — install from the DMG, update from the app.
