# A DISPOSABLE diagnostic. Delete it once Windows builds again.
#
# The Windows release job has now died at the 6-hour ceiling three times, and every read of WHY has
# come from inferring cause out of cargo's last printed line — which is the wrong evidence, because
# cargo prints `Compiling <pkg>` when a unit STARTS and only once per package. Three hypotheses died
# that way: MSVC link.exe (lld changed nothing), the transpiled band (macOS timings put fab-bosl2 at
# 789s and Windows reached the next unit on schedule), and fab-gui's font build script (it has a
# cache-hit fast path, and its regen path would panic on Windows rather than hang).
#
# So this stops guessing and instruments instead:
#
#   --verbose      cargo prints each rustc invocation AS IT STARTS, so the last line names the unit
#                  actually in flight when the clock runs out — the thing we have never had.
#   split steps    fab (no bevy, no gui) and fab-gui separately, so a hang is attributed to one or
#                  the other instead of to "the build".
#   timeout-minutes + continue-on-error
#                  the job SURVIVES a stalled step and reaches the upload. A job killed at the
#                  runner ceiling does not run its remaining steps, `if: always()` or not — which is
#                  why the last run's timings artifact exists for macOS and not for Windows.
#   macOS in the matrix
#                  a same-commit control. macOS does the whole build in 14.3 min, so any step that
#                  is fast there and slow here isolates the platform, not the code.
name: win-probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # STEP 1 — everything EXCEPT the gui: the evaluator, the kernel and the whole transpiled band.
      # If this completes on Windows, the band is exonerated and the problem is downstream of it.
      - name: Build fab (band + kernel, no bevy)
        id: fab
        timeout-minutes: 45
        continue-on-error: true
        run: cargo build --release -p fab-scad --bin fab --verbose --timings

      # STEP 2 — the gui, which is where macOS spends 21.7s and Windows appears to spend >5.5 hours.
      - name: Build fab-gui (bevy + the band)
        id: gui
        timeout-minutes: 60
        continue-on-error: true
        run: cargo build --release -p fab-gui --bin fab-gui --verbose --timings

      - name: Outcome
        if: always()
        shell: bash
        run: |
          echo "fab:     ${{ steps.fab.outcome }}"
          echo "fab-gui: ${{ steps.gui.outcome }}"

      # The whole point of the run. `if: always()` works HERE because the steps above are bounded and
      # non-fatal, so the job is still alive to execute it.
      - name: Timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-timings-${{ matrix.os }}
          path: target/cargo-timings/
          if-no-files-found: warn
