[package]
name = "fab-scad"
version = "1.2.0"
edition = "2024"
description = "Workflow layer around OpenSCAD: render, slice, output, publish"
license = "GPL-2.0-or-later"
repository = "https://github.com/chotchki/fab-scad"
# crates.io ships ONLY the tool (18.9) — without this the .crate drags models/, docs/, spikes/
# and blows past the registry's 10 MiB cap (naive package: 26.5 MiB compressed).
include = ["src/**", "LICENSE", "README.md"]

[lib]
name = "fab_scad"
path = "src/lib.rs"

[[bin]]
name = "fab"
path = "src/main.rs"
required-features = ["native"]

# The BOSL2 corpus isolation worker (K.1): runs ONE test script (stdin) so a stack-overflow abort takes down
# only this process, not the parent sweep. Not a user-facing tool — the corpus harness spawns it.
[[bin]]
name = "corpus_worker"
path = "src/bin/corpus_worker.rs"
required-features = ["native"]

# Single-test repro for the L.2 burn-down: runs ONE named BOSL2 test and prints its bucket, FULL error, and
# console (echo/warning) output — with an optional `--trace` for the evaluator's `set -x`. The debug
# counterpart to the sweep's one-line-per-test roster. A dev tool, not user-facing.
[[bin]]
name = "corpus_repro"
path = "src/bin/corpus_repro.rs"
required-features = ["native"]

# SZ.2: pack libs.json from the SAME library list `import::registry()` is built from, replacing the
# python glob whose hand-written directory list drifted from the cargo features. A build-time tool.
[[bin]]
name = "pack_libs"
path = "src/bin/pack_libs.rs"
required-features = ["native"]

# SZ.9.3: does the geometry the BROWSER produced match the geometry the DESKTOP produced? Compares two
# meshes (.stl or .3mf, mixed) on triangle count, vertex multiset, bbox and volume. `kernel` for the 3MF
# reader; the web save path emits 3MF unconditionally, so a comparator without it would be STL-only.
[[bin]]
name = "mesh_diff"
path = "src/bin/mesh_diff.rs"
required-features = ["native", "kernel"]

# The models-harness isolation worker (L.3): evaluates ONE model file (include graph + `import()` meshes) and
# prints its outcome, so the harness can KILL a runaway — the interpreter is slow enough on heavy BOSL2
# geometry that ~half the real models blow a 10 s budget — instead of leaking a host thread per timeout.
[[bin]]
name = "models_worker"
path = "src/bin/models_worker.rs"
required-features = ["native"]

# One-file differential repro (L.3 divergence hunt): runs ONE .scad through scad-rs + the oracle and prints
# the mesh verdict (AGREE / genus X vs Y / residual). The reduce-and-diagnose tool for a flagged DIVERGE.
[[bin]]
name = "diff_repro"
path = "src/bin/diff_repro.rs"
required-features = ["native"]

# Echo dump (L.3.4): prints a .scad's echo/warning output through scad-rs — the VALUE-level counterpart to
# diff_repro, for bisecting a construction (e.g. why a VNF comes out empty) against OpenSCAD's echo.
[[bin]]
name = "echo_repro"
path = "src/bin/echo_repro.rs"
required-features = ["native"]

[workspace]
members = ["bosl2", "gen", "geom", "gui", "lang", "lib", "machineblocks", "manifold", "mcad", "types"]
# The fuzz crate is nightly-only (cargo-fuzz) — kept out of the workspace so stable builds never see it.
exclude = ["manifold/fuzz"]

[features]
# The in-process Manifold geometry kernel (Track C). Default-on so the normal build + tests
# exercise it, but gated so a kernel-less build doesn't need a C++ toolchain (cmake/clang).
default = ["kernel", "libraries", "native"]
# `geometry` (fab-lang) too: the kernel now speaks the shared geom vocabulary (Vec3/Tri/Affine), so
# Solid's mesh + transform APIs are typed. fab-lang is pure Rust — cheap to pull in alongside Manifold.
kernel = [
    "geometry",
    "mesh-io",
    "dep:fab-manifold",
    "dep:threemf",
    "dep:quick-xml",
    "dep:usvg",
]
# SZ.4 — THE TRANSPILED BAND, as its own axis so a build can have the kernel WITHOUT it. Measured:
# the band is 2.75 MB of the browser worker's 3.85 MB brotli, and a model either uses BOSL2 (and
# then pulls ~70% of it — 122 real models span just 9 include-closures, all 67-76%) or uses none at
# all. There is no middle population, so the win is "don't ship it to someone who isn't using a
# library", which needs the band to be separable from the kernel. Split out of `kernel` rather than
# made default-off: every shipped desktop build and the full web worker still carry it.
libraries = ["bosl2", "mcad"]

# BOSL2, transpiled to Rust at build time (AR.26.4.3) — `import::registry()` accumulates it beside
# fab-lang's own rows, so the compiled tier covers 1260 BOSL2 functions and 402 modules instead of
# the 66 fab-lang hand-wrote. Rides `kernel`, which is what both the CLI and the wasm app turn on, so
# the browser gets the same one tier the desktop does (it cannot JIT in-sandbox — that benefit was
# the phase's, and it only lands if the wasm build carries the library).
#
# ITS OWN AXIS rather than folded into `geometry`, because it is not free: fab-bosl2's build script
# compiles fab-lib + fab-lang host-side and transpiles ~85K lines of BOSL2, and the miri-lean
# `--no-default-features --features geometry` build has no business paying for that. Without it every
# BOSL2 call INTERPRETS — slower, never a different answer.
bosl2 = ["geometry", "dep:fab-bosl2"]
# AR.37 — the SECOND and THIRD transpiled libraries, each its own crate on the fab-bosl2 pattern.
# `mcad` rides `kernel` because MCAD ships WITH OpenSCAD, so a user's `include <MCAD/...>` is a
# thing that actually happens and 39 functions is a cheap thing to cover. `machineblocks` does NOT:
# it is a third-party brick library, carried for the generality evidence rather than for users, and
# a build has no business transpiling it unless somebody asked.
mcad = ["geometry", "dep:fab-mcad"]
machineblocks = ["geometry", "dep:fab-machineblocks"]
# Threaded kernel on BROWSER wasm (W.6): turn on fab-manifold's rayon-over-wasm-bindgen-rayon pool. The
# geom worker's wasm build opts in (fab-geom `par`); native already gets `par` unconditionally (the
# target-scoped dep below). Carries manifold's `initThreadPool` JS export into the final cdylib.
kernel-par = ["kernel", "fab-manifold/par"]
# The Bambu `.3mf` WRITER (`bambu`): an OPC zip of hand-written XML + indexed meshes — mesh-only, no
# Solid, no C++ kernel. Split out of `kernel` (W.3.4) so the wasm fab-gui app can co-pack + export
# in-process without the Manifold toolchain, while the miri-lean `geometry` build stays zip-free.
mesh-io = ["geometry", "dep:zip", "dep:serde_json"]
# Everything that needs an OS (18.3): the OpenSCAD spawn, publish (blocking reqwest), project
# scaffolding, the smoke sweep, and the CLI-only deps. `--no-default-features` is the wasm32-safe
# core — pure geometry/slicing/spec logic, no process spawn, no network.
# fab-lang (the scad-rs evaluator) ALONE — the geometry backend + its miri interface test need `Mesh`
# without the OS-heavy native deps (reqwest/clap/rayon choke miri). `native` implies it.
geometry = ["dep:fab-lang"]
native = ["dep:reqwest", "dep:clap", "dep:rayon", "dep:fab-gen", "geometry"]

[dependencies]
# scad-rs, our OpenSCAD reimplementation — the differential harness's OTHER engine (G.3.7). Pure
# Rust + wasm-clean, but only the native differ uses it for now, so gate it behind `native`.
fab-lang = { path = "lang", optional = true }
# BOSL2 as a generated library crate (AR.26.3): nothing checked in, transpiled by its build.rs from
# the pinned submodule into OUT_DIR. Handed to the evaluator as registry rows, never called directly.
fab-bosl2 = { path = "bosl2", optional = true }
# AR.37: MCAD and machineblocks, same build-time transpile, same registry hand-off.
fab-mcad = { path = "mcad", optional = true }
fab-machineblocks = { path = "machineblocks", optional = true }
# AJ.8 gen-diff: the grammar generator feeding the oracle differential (native harness only).
fab-gen = { path = "gen", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Structured logging facade (both targets, wasm-safe). Kernel geometry ops log diagnostics at DEBUG and
# shout at WARN on a non-manifold result — near-zero without a subscriber; fab-lang already uses it.
tracing = "0.1"
rayon = { version = "1", optional = true }
threemf = { version = "0.8.0", optional = true }
# threemf's serde can't round-trip <m:basematerials> (namespace-prefix renames) — threemf_in
# pull-parses the materials table itself, prefix-agnostic.
quick-xml = { version = "0.39", optional = true }
# SVG (2D vector) import (Q.4). usvg NORMALIZES an SVG document — resolves viewBox/units/transforms, expands
# shapes (rect/circle/ellipse/line/polyline/polygon) + use/defs/styles into a flat tree of Bézier paths — so
# the reader only owns flattening + the OpenSCAD scale/Y-flip affine. default-features=false drops the `text`
# feature (fontdb + system-font lookup = non-deterministic, banned by doctrine #36); SVG <text> then imports
# EMPTY, which is exactly what OpenSCAD's own SVG importer does with text.
usvg = { version = "0.45", optional = true, default-features = false }
# The geomsvc wire codec (worker postMessage envelope). Wire types are bincode-safe by
# construction — no untagged enums (Num stays OUT of the wire).
bincode = "1"
# Stored (no compression) only — default features pull bzip2/zstd backends we don't need.
zip = { version = "8", optional = true, default-features = false }
# The `.scadproj` manifest (fab-project.json) ser/de — rides `mesh-io` with `zip` (Phase Z). Also a
# dev-dependency (the publish tests use it under `native`-without-`kernel`), which coexists.
serde_json = { version = "1", optional = true }
# Publish client (fab publish → hotchkiss.io). Blocking (the CLI/GUI aren't async here); rustls so
# we don't drag in system OpenSSL. multipart for media upload, json for the upload response.
reqwest = { version = "0.12", default-features = false, optional = true, features = [
    "blocking",
    "multipart",
    "json",
    "rustls-tls",
] }

# The models harness (L.3) subscribes to fab-lang's TRACE-level eval spans to PROFILE per builtin/module
# (the intrinsic worklist L.4 cuts the JIT phase from) — the subscriber side, test-only, so the shipped
# lib stays subscriber-agnostic + wasm never sees it. `registry` gives the span store the layer times.
[dev-dependencies]
# AJ.7 gen_ab soak: generated programs A/B'd across cache configs (also a normal dep under
# `native` for the gen-diff oracle harness — listed here so tests build without feature games).
fab-gen = { path = "gen" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# The BU.6 perf harness's run/baseline artifacts (perf/) — test-only writer.
serde_json = "1"
# credentials.rs tests sandbox $HOME to a throwaway dir (env vars are process-global).
tempfile = "3"

# The kernel per target (18.4): native gets the default `parallel` (TBB); wasm32 swaps to the
# provisional `unstable-wasm-uu` backend (C++ via wasm-cxx-shim, single-threaded, no exceptions).
# Same crate, same API — kernel.rs doesn't know which it got.
# OUR Manifold port (Phase M) — the kernel backend since M.7.3 (the C++ manifold3d bindings were
# CUT at M.7.4). Parallel on native; serial on wasm by default (the gui's threaded build opts into
# `par` itself).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fab-manifold = { path = "manifold", optional = true, features = ["par"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
fab-manifold = { path = "manifold", optional = true }
